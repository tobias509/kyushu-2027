<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>2027 九州家族行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;800&family=Noto+Sans+TC:wght@400;500;700&family=Quicksand:wght@500;600;700&display=swap">
<style>
body{margin:0}img{max-width:100%}

/* Layout: 手機 App 版面。上方日期列（sticky）→ 單日檢視（每日卡片＋分類時間軸），底部固定分頁列：行程／伴手禮／記帳／旅行資訊。
   淺色單一主題（韓系清新：大量留白、粉彩分類色、圓角、柔和陰影） */
:root{
  color-scheme:light;
  --bg:#F3F6F4; --card:#FFFFFF; --ink:#1D2A26; --sub:#5D6E68; --faint:#94A39D; --line:#D8E2DD;
  --pri:#2F6B57; --pri-soft:#DCEBE4; --onsen:#B5452F; --onsen-soft:#F7E3DD;
  --display:"Noto Serif TC","Songti TC",serif;
  --sight:#25936F; --sight-bg:#E4F5EE;
  --food:#E2673F; --food-bg:#FFF0E8;
  --move:#3F7FE0; --move-bg:#E8F1FF;
  --shop:#8A5FD0; --shop-bg:#F1EBFC;
  --stay:#A98014; --stay-bg:#FFF5D6;
  --t-eat:#E04452; --t-eat-bg:#FFEAEC;
  --t-menu:#C96A06; --t-menu-bg:#FFF1D8;
  --t-buy:#B2437F; --t-buy-bg:#FCE9F3;
  --t-book:#2160E0; --t-book-bg:#E2ECFF;
  --font:"Noto Sans TC","PingFang TC","Heiti TC","Microsoft JhengHei",sans-serif;
  --num:"Quicksand","Noto Sans TC","PingFang TC",sans-serif;
  --r:16px; --shadow:0 0 0 1px var(--line);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
html{font-size:17.5px}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.6;-webkit-tap-highlight-color:transparent}
a{color:var(--pri)}
button,input,select{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--display)}

/* 頂部 */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:6px 4px 14px}
.top h1{font-size:1.75rem;font-weight:800;letter-spacing:.02em;line-height:1.25;word-break:keep-all;text-wrap:wrap}
.top p{word-break:keep-all}
.top p{margin:2px 0 0;color:var(--sub);font-size:.88rem}
.count{flex:none;text-align:right;background:var(--card);border-radius:16px;padding:8px 12px;box-shadow:var(--shadow);line-height:1.25}
.count b{display:block;font-family:var(--num);font-size:1.35rem;color:var(--onsen)}
.count span{font-size:.72rem;color:var(--sub)}

/* 日期列 */
.strip-wrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);margin-inline:-16px;padding:8px 0 10px}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 16px;scroll-padding:0 16px}
.strip::-webkit-scrollbar{display:none}
.grp{flex:none;writing-mode:vertical-rl;font-size:.68rem;letter-spacing:.12em;color:var(--faint);padding:4px 0;margin-inline:2px}
.dchip{flex:none;display:grid;justify-items:center;gap:0;min-width:3.3rem;padding:7px 8px;border-radius:12px;border:0;background:var(--card);box-shadow:var(--shadow);cursor:pointer;line-height:1.2}
.dchip small{font-family:var(--num);font-size:.66rem;font-weight:700;color:var(--faint);letter-spacing:.04em}
.dchip b{font-family:var(--display);font-size:1.02rem;font-weight:800}
.dchip span{font-size:.7rem;color:var(--sub)}
.dchip i{font-style:normal;font-size:.64rem;color:var(--onsen);font-weight:700}
.dchip[aria-current="true"]{background:var(--pri);color:#fff}
.dchip[aria-current="true"] small,.dchip[aria-current="true"] span,.dchip[aria-current="true"] i{color:rgba(255,255,255,.85)}
.dchip.today:not([aria-current="true"]){box-shadow:inset 0 0 0 2px var(--pri)}

/* 每日卡片 */
.dayhead{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:18px 18px 16px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.dh-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dnum{font-family:var(--num);font-weight:700;font-size:.8rem;letter-spacing:.08em;color:var(--pri);background:var(--pri-soft);border-radius:999px;padding:2px 10px}
.ddate{font-family:var(--num);font-weight:700;font-size:.95rem;color:var(--sub)}
.dtag{font-size:.74rem;font-weight:700;color:var(--food);background:var(--food-bg);border-radius:999px;padding:1px 9px}
.dayhead h2{font-size:1.4rem;line-height:1.35;font-weight:700}
.gather{display:flex;align-items:center;gap:12px;background:var(--pri-soft);border-radius:16px;padding:10px 14px}
.gather .lb{font-size:.72rem;font-weight:700;color:var(--pri);letter-spacing:.1em;writing-mode:vertical-rl}
.gather .tm{font-family:var(--num);font-weight:700;font-size:1.7rem;color:var(--pri);line-height:1}
.gather .tx{font-size:.9rem;min-width:0}
.wx{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:16px;padding:9px 12px}
.wx svg{flex:none;width:26px;height:26px;color:var(--move)}
.wx .wt{flex:1;min-width:0;font-size:.86rem;line-height:1.45}
.wx .wt b{font-size:.92rem}
.wx .wt .temp{font-family:var(--num);font-weight:700;color:var(--ink)}
.wx .wt .hi{color:var(--food)} .wx .wt .lo{color:var(--move)}
.wx a{flex:none;font-size:.8rem;font-weight:700;text-decoration:none;background:var(--move-bg);color:var(--move);border-radius:999px;padding:5px 10px;white-space:nowrap}
.bed{display:flex;gap:8px;align-items:center;font-size:.86rem;color:var(--sub)}
.bed svg{width:18px;height:18px;color:var(--stay);flex:none}
.hl{display:flex;flex-wrap:wrap;gap:6px}

/* 標籤 */
.tg{display:inline-flex;align-items:baseline;gap:5px;font-size:.8rem;line-height:1.35;border-radius:10px;padding:3px 9px;max-width:100%}
.tg b{font-size:.68rem;letter-spacing:.04em;white-space:nowrap}
.tg.eat{background:var(--t-eat-bg);color:var(--t-eat)}
.tg.menu{background:var(--t-menu-bg);color:var(--t-menu)}
.tg.buy{background:var(--t-buy-bg);color:var(--t-buy)}
.tg.book{background:var(--t-book-bg);color:var(--t-book)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.74rem;color:var(--sub);padding:2px 4px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}

/* 時間軸 */
.sec-t{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 8px}
.sec-t h3{font-size:1.02rem}
.sec-t span{font-size:.78rem;color:var(--faint)}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:10px;position:relative}
.rw{display:grid;grid-template-columns:3.3rem 1fr;gap:10px;align-items:start}
.tm{font-family:var(--num);font-weight:700;font-size:.95rem;line-height:1.2;padding-top:14px;text-align:right;color:var(--ink)}
.tm small{display:block;font-size:.74rem;color:var(--faint);font-weight:600}
.bd{min-width:0;border-radius:var(--r);padding:12px 14px;display:grid;gap:6px}
.card .bd{background:var(--card);box-shadow:var(--shadow)}
.slim .bd{background:transparent;border:1.5px dashed var(--line);padding:9px 12px}
.slim .tm{padding-top:10px;font-size:.86rem;color:var(--sub)}
.kd{display:flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;letter-spacing:.08em}
.kd svg{width:18px;height:18px;padding:3px;border-radius:7px}
.s .kd{color:var(--sight)} .s .kd svg{background:var(--sight-bg)}
.f .kd{color:var(--food)} .f .kd svg{background:var(--food-bg)}
.b .kd{color:var(--shop)} .b .kd svg{background:var(--shop-bg)}
.m .kd{color:var(--move)} .m .kd svg{background:var(--move-bg)}
.h .kd{color:var(--stay)} .h .kd svg{background:var(--stay-bg)}
.ti{font-weight:700;font-size:1rem;line-height:1.45}
.slim .ti{font-size:.94rem;font-weight:500}
.fl{display:inline-block;font-size:.68rem;font-weight:700;color:var(--sub);background:var(--bg);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:.12em}
.how{font-size:.84rem;color:var(--sub)}
.nt{margin:0;padding-left:1.05em;font-size:.86rem;color:var(--ink);display:grid;gap:2px}
.nt li::marker{color:var(--faint)}
.tgs{display:flex;flex-wrap:wrap;gap:5px}
.story{border-radius:14px;padding:9px 12px;font-size:.86rem;line-height:1.65}
.s .story{background:var(--sight-bg)} .f .story{background:var(--food-bg)} .b .story{background:var(--shop-bg)} .m .story{background:var(--move-bg)} .h .story{background:var(--stay-bg)}
.story b{display:block;font-size:.72rem;letter-spacing:.08em;margin-bottom:2px}
.s .story b{color:var(--sight)} .f .story b{color:var(--food)} .b .story b{color:var(--shop)} .m .story b{color:var(--move)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.nav{display:inline-flex;align-items:center;gap:5px;font-size:.82rem;font-weight:700;text-decoration:none;color:#fff;background:var(--pri);border-radius:999px;padding:6px 13px}
.nav svg{width:15px;height:15px}
.nav.drive{background:var(--sight)}

.alt{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin-top:12px}
.alt>summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px}
.alt>summary::-webkit-details-marker{display:none}
.alt>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);transform:rotate(45deg);transition:transform .2s}
.alt[open]>summary::after{transform:rotate(-135deg)}
.alt .in{padding:0 14px 14px;display:grid;gap:10px}
.alt .in>p{margin:0;font-size:.88rem;color:var(--sub)}
.alt.snow>summary{color:var(--move)}
.note{margin:12px 4px 0;font-size:.82rem;color:var(--sub)}

.shops{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.shop{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:10px 12px;display:grid;gap:2px;min-width:0}
.shop b{font-size:.9rem}
.shop span{font-size:.78rem;color:var(--sub)}
.shop .cl{font-family:var(--num);font-weight:700;font-size:.78rem;color:var(--food)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.pager button{border:0;background:var(--card);box-shadow:var(--shadow);border-radius:16px;padding:12px;cursor:pointer;text-align:left;display:grid;gap:0;line-height:1.35}
.pager button:last-child{text-align:right}
.pager small{font-family:var(--num);font-weight:700;color:var(--pri);font-size:.74rem}
.pager span{font-size:.86rem;font-weight:500}
.pager button:disabled{visibility:hidden}

/* 共用區塊 */
.panel{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.panel>*{min-width:0}
.ph{padding:6px 4px 2px}
.ph h2{font-size:1.35rem}
.ph p{margin:4px 0 0;color:var(--sub);font-size:.88rem}
.box{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;min-width:0}
.box h3{font-size:1.05rem;display:flex;align-items:center;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;text-decoration:none;font-size:.86rem;font-weight:700;color:var(--ink);background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:7px 14px}

/* 伴手禮 */
.gift-empty{text-align:center;padding:26px 18px}
.gift-empty svg{width:44px;height:44px;color:var(--t-buy)}
.gift-empty p{margin:6px 0 0;color:var(--sub);font-size:.9rem}
.glist{display:grid;gap:8px}
.gi{display:flex;gap:10px;align-items:flex-start}
.gi .tg{flex:none}
.gi span{font-size:.84rem;color:var(--sub)}

.gfil button{flex:none;border:0;font-size:.86rem;font-weight:700;color:var(--ink);background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:7px 14px;cursor:pointer}
.gfil button[aria-pressed="true"]{background:var(--t-buy);color:#fff}
.greg{display:grid;gap:0}
.ggrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.ggrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.gcard{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-rows:auto 1fr;min-width:0}
.gph{aspect-ratio:4/3;max-width:100%;width:100%;display:grid;place-items:center;align-content:center;gap:4px;border:0;padding:0;margin:0}
.gph svg{width:34px;height:34px;opacity:.85}
.gph span{font-size:.7rem;font-weight:700;opacity:.75}
.gph.has{cursor:zoom-in;background:var(--bg)}
.gph img{width:100%;height:100%;object-fit:cover;display:block}
.gbd{padding:10px 12px 12px;display:grid;gap:5px;align-content:start;min-width:0}
.gtop{display:flex;justify-content:space-between;gap:6px;align-items:center}
.gc{font-size:.7rem;font-weight:700;letter-spacing:.06em}
.gs{font-size:.66rem;font-weight:700;border-radius:999px;padding:1px 7px;white-space:nowrap}
.gs.ok{background:var(--sight-bg);color:var(--sight)}
.gs.warn{background:var(--t-menu-bg);color:var(--t-menu)}
.gs.no{background:var(--t-eat-bg);color:var(--t-eat)}
.gcard h4{margin:0;font-size:.92rem;line-height:1.4}
.gcard .tg{font-size:.74rem}
.gl{font-size:.76rem;color:var(--sub);line-height:1.45}
.gl b{display:block;font-size:.66rem;color:var(--faint);letter-spacing:.06em}
.glink{font-size:.76rem;font-weight:700;text-decoration:none;margin-top:2px}

/* 旅行資訊 */
.fly{display:grid;gap:3px;border-radius:18px;padding:14px 16px;background:var(--move-bg)}
.fly .k{font-size:.74rem;font-weight:700;letter-spacing:.08em;color:var(--move)}
.fly .route{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem}
.fly .route svg{width:18px;height:18px;color:var(--move)}
.fly .times{font-family:var(--num);font-weight:700;font-size:1.5rem;line-height:1.2}
.fly .times small{font-family:var(--font);font-size:.72rem;font-weight:500;color:var(--sub);margin-left:4px}
.fly .s{font-size:.84rem;color:var(--sub)}
.st{border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:grid;gap:8px}
.st .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.st .ar{font-size:.74rem;font-weight:700;color:var(--sub);letter-spacing:.06em}
.st h4{margin:2px 0 0;font-size:1rem;line-height:1.4}
.badge{flex:none;font-size:.74rem;font-weight:700;border-radius:999px;padding:2px 10px}
.badge.ok{background:var(--sight-bg);color:var(--sight)}
.badge.wait{background:var(--stay-bg);color:var(--stay)}
.badge.alt{background:var(--bg);color:var(--sub)}
.dates{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.86rem;background:var(--bg);border-radius:12px;padding:7px 11px}
.dates span b{font-size:.72rem;color:var(--sub);margin-right:5px}
dl.kv{margin:0;display:grid;gap:3px;font-size:.86rem}
dl.kv>div{display:grid;grid-template-columns:3.2rem 1fr;gap:8px}
dl.kv dt{color:var(--sub)}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.st ul{margin:0;padding-left:1.05em;font-size:.85rem;display:grid;gap:2px}
.tel{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tel:last-child{border-bottom:0}
.tel .n{font-weight:700;font-size:.92rem}
.tel .d{font-size:.78rem;color:var(--sub);grid-column:1}
.tel .no{grid-row:1/3;grid-column:2;display:grid;justify-items:end;gap:4px}
.tel .no a{font-family:var(--num);font-weight:700;font-size:1.1rem;text-decoration:none;color:var(--ink);user-select:all}
.tel .no button,.copy{border:0;background:var(--bg);border-radius:999px;font-size:.74rem;font-weight:700;color:var(--sub);padding:3px 10px;cursor:pointer}
.tel.urgent .no a{color:var(--t-eat)}

/* 記帳 */
.sum{background:linear-gradient(140deg,#6A86F4,#8BA4F8);color:#fff;border-radius:24px;padding:18px;display:grid;gap:10px;box-shadow:var(--shadow)}
.sum .lb{font-size:.8rem;opacity:.9}
.sum .big{font-family:var(--num);font-weight:700;font-size:2.1rem;line-height:1.1}
.sum .twd{font-family:var(--num);font-size:.95rem;opacity:.92}
.bar{height:8px;border-radius:999px;background:rgba(255,255,255,.3);overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:999px}
.sum .row2{display:flex;justify-content:space-between;font-size:.8rem;opacity:.95;gap:10px;flex-wrap:wrap}
form.add{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.amt{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:16px;padding:6px 14px}
.amt span{font-family:var(--num);font-weight:700;font-size:1.3rem;color:var(--sub)}
.amt input{flex:1;min-width:0;border:0;background:transparent;font-family:var(--num);font-weight:700;font-size:1.6rem;padding:4px 0;outline:none}
.fld{display:grid;gap:4px;min-width:0}
.fld label{font-size:.78rem;color:var(--sub);font-weight:500}
.fld input,.fld select{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 12px;font-size:.95rem;width:100%;min-width:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:.84rem;cursor:pointer}
.pick button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.primary{border:0;background:var(--pri);color:#fff;font-weight:700;border-radius:14px;padding:12px;font-size:1rem;cursor:pointer}
.msg{font-size:.82rem;color:var(--t-eat);min-height:1.2em;margin:0}
.cats{display:grid;gap:8px}
.cat{display:grid;grid-template-columns:3.6rem 1fr auto;gap:10px;align-items:center;font-size:.84rem}
.cat .tr{height:8px;border-radius:999px;background:var(--bg);overflow:hidden}
.cat .tr i{display:block;height:100%;border-radius:999px;background:var(--pri)}
.cat .v{font-family:var(--num);font-weight:700}
.items{display:grid;gap:0}
.it{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it .nm{font-size:.92rem;font-weight:500;min-width:0;overflow-wrap:anywhere}
.it .mt{grid-column:1;font-size:.74rem;color:var(--sub)}
.it .v{grid-row:1/3;grid-column:2;font-family:var(--num);font-weight:700}
.it .del{grid-row:1/3;grid-column:3;border:0;background:var(--bg);border-radius:999px;font-size:.72rem;padding:4px 9px;color:var(--sub);cursor:pointer;white-space:nowrap}
.it .del.confirm{background:var(--t-eat-bg);color:var(--t-eat);font-weight:700}
.dayg{font-family:var(--num);font-size:.76rem;font-weight:700;color:var(--faint);padding:10px 0 2px;letter-spacing:.04em}
.est{width:100%;border-collapse:collapse;font-size:.84rem}
.est td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top}
.est td:first-child{font-family:var(--num);font-weight:700;color:var(--faint);width:3.4rem;font-size:.76rem;padding-top:8px}
.est td:last-child{text-align:right;font-family:var(--num);font-weight:700;white-space:nowrap}
.est tfoot td{border-bottom:0;font-weight:700;color:var(--ink);padding-top:10px;font-size:.9rem}
.small{font-size:.78rem;color:var(--sub);margin:0}

/* 底部分頁列 */

 const body=w.hi!=null?`<b>${esc(w.nm)}</b>・2 月平均 <span class="temp hi">${w.hi}°</span> / <span class="temp lo">${w.lo}°</span><br><span style="color:var(--sub)">白天最高／清晨最低（氣象廳平年值）</span>`

const WXC=c=>c===0?"晴":c<=2?"晴時多雲":c===3?"陰":c<=48?"霧":c<=57?"毛毛雨":c<=67?"雨":c<=77?"雪":c<=82?"陣雨":c<=86?"陣雪":"雷雨";
const wxCache={};
async function wxLive(n){
 const d=DAYS[n-1],w=WX[d.wx];if(!w||w.la==null)return;
 const date=`2027-02-${String(n+1).padStart(2,"0")}`;
 const days=(Date.UTC(2027,1,n+1)-twToday)/864e5;if(days<0||days>15)return;
 try{
  const k=d.wx;wxCache[k]=wxCache[k]||fetch(`https://api.open-meteo.com/v1/forecast?latitude=${w.la}&longitude=${w.lo_}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=16`).then(r=>r.json());
  const j=await wxCache[k];const i=j.daily.time.indexOf(date);if(i<0||cur!==n)return;
  const el=document.getElementById("wxt");if(!el)return;
  el.innerHTML=`<b>${esc(w.nm)}</b>・${WXC(j.daily.weather_code[i])} <span class="temp hi">${Math.round(j.daily.temperature_2m_max[i])}°</span> / <span class="temp lo">${Math.round(j.daily.temperature_2m_min[i])}°</span>・降雨 ${j.daily.precipitation_probability_max[i]??"-"}%<br><span style="color:var(--sub)">即時預報（Open-Meteo）</span>`;
 }catch(_){}
}
function renderDay(){setTimeout(()=>wxLive(cur),0);
 const d=DAYS[cur-1];
 const all=[...d.rows,...(d.alts||[]).flatMap(a=>a.rows||[])];
 const hl=[];const seen=new Set();
 d.rows.forEach(r=>(r.tg||[]).forEach(([c,x])=>{if((c==="eat"||c==="buy"||c==="book")&&!seen.has(x)){seen.add(x);hl.push(`<span class="tg ${c}"><b>${TAGN[c]}</b>${esc(x)}</span>`)}}));
 const prev=DAYS[cur-2],next=DAYS[cur];
 $("day").innerHTML=`
 <article class="dayhead">
  <div class="dh-top"><span class="dnum">DAY ${d.n}</span><span class="ddate">${esc(d.d)}（${esc(d.w)}）</span>${d.tag?`<span class="dtag">${esc(d.tag)}</span>`:""}</div>
  <h2>${esc(d.r)}</h2>
  <div class="gather"><span class="lb">集合</span><span class="tm">${esc(d.gather[0])}</span><span class="tx">${esc(d.gather[1])}</span></div>
  ${wxHtml(d)}
  ${hl.length?`<div class="hl">${hl.join("")}</div>`:""}
  ${d.bed?`<div class="bed">${IC.h}今晚住：${esc(d.bed)}</div>`:`<div class="bed">${IC.plane}今天回台灣</div>`}
 </article>
 <div class="sec-t"><h3>今日行程</h3><span>時間為日本時間</span></div>
 <div class="legend"><span><i style="background:var(--sight)"></i>景點</span><span><i style="background:var(--food)"></i>美食</span><span><i style="background:var(--shop)"></i>購物</span><span><i style="background:var(--move)"></i>交通</span><span><i style="background:var(--stay)"></i>住宿・休息</span></div>
 <ol class="tl" style="margin-top:8px">${d.rows.map(r=>rowHtml(r,d.mode)).join("")}</ol>
 ${d.note?`<p class="note">※ ${esc(d.note)}</p>`:""}
 ${d.shops?`<div class="sec-t"><h3>湯之坪街道小吃清單</h3><span>關門時間</span></div><div class="shops">${d.shops.map(s=>`<div class="shop"><b>${esc(s[0])}</b><span>${esc(s[1])}</span>${s[2]?`<span class="cl">${esc(s[2])}</span>`:""}${s[3]?`<a class="nav" style="justify-self:start;margin-top:4px;padding:4px 10px" href="${navUrl(s[3],"walking")}" target="_blank" rel="noopener">${IC.nav}導航</a>`:""}</div>`).join("")}</div>`:""}
 ${(d.alts||[]).map(a=>`<details class="alt${a.snow?" snow":""}"><summary>${esc(a.label)}</summary><div class="in">${a.text?`<p>${esc(a.text)}</p>`:""}${a.rows?`<ol class="tl">${a.rows.map(r=>rowHtml(r,"driving")).join("")}</ol>`:""}</div></details>`).join("")}
 <div class="pager">
  <button type="button" data-go="${cur-1}" ${prev?"":"disabled"}><small>← DAY ${prev?prev.n:""}</small><span>${prev?esc(prev.r):""}</span></button>
  <button type="button" data-go="${cur+1}" ${next?"":"disabled"}><small>DAY ${next?next.n:""} →</small><span>${next?esc(next.r):""}</span></button>
 </div>`;
}
function goDay(n,scroll){
 if(!(n>=1&&n<=14))return;
 cur=n;store.set("ky-day",n);
 document.querySelectorAll(".dchip").forEach(c=>c.setAttribute("aria-current",+c.dataset.day===n));
 renderDay();
 const chip=document.querySelector(`.dchip[data-day="${n}"]`);
 if(chip)chip.scrollIntoView({inline:"center",block:"nearest"});
 if(scroll)window.scrollTo(0,0);
}
document.addEventListener("click",e=>{
 const c=e.target.closest(".dchip");if(c){goDay(+c.dataset.day,true);return}
 const g=e.target.closest("[data-go]");if(g&&!g.disabled){goDay(+g.dataset.go,true)}
});

function giftCard(g){
 const [tone,ic]=GCAT[g.c]||["buy","b"];
 const q="https://www.google.com/search?tbm=isch&q="+encodeURIComponent(g.nm);
 const photo=g.img
  ?`<button type="button" class="gph has" data-img="${esc(g.img)}" data-cap="${esc(g.nm)}" aria-label="放大 ${esc(g.nm)} 的照片"><img src="${esc(g.img)}" alt="${esc(g.nm)}" loading="lazy"></button>`
  :`<div class="gph" style="background:var(--${tone==="buy"?"t-buy":tone}-bg);color:var(--${tone==="buy"?"t-buy":tone})">${IC[ic]}<span>照片待補</span></div>`;
 return `<article class="gcard">${photo}<div class="gbd">
  <div class="gtop"><span class="gc" style="color:var(--${tone==="buy"?"t-buy":tone})">${esc(g.c)}</span><span class="gs ${GST[g.s][1]}">${GST[g.s][0]}</span></div>
  <h4>${esc(g.nm)}</h4>
  ${g.rec?`<span class="tg buy"><b>推薦</b>${esc(g.rec)}</span>`:""}
  ${g.w?`<div class="gl"><b>哪裡買</b>${esc(g.w)}</div>`:""}
  ${g.p?`<div class="gl"><b>價格</b><span class="num">${esc(g.p)}</span></div>`:""}
  <div class="gl"><b>帶回台灣</b>${esc(g.sv)}</div>
  <a class="glink" href="${q}" target="_blank" rel="noopener">看商品照片 ↗</a>
 </div></article>`;
}
function renderGift(){
 const regs=GIFT_REG.filter(r=>GIFTS.some(g=>g.r===r.k));
 if(giftReg!=="all"&&!regs.some(r=>r.k===giftReg))giftReg="all";
 const fromPlan=[];
 DAYS.forEach(d=>[...d.rows,...(d.alts||[]).flatMap(a=>a.rows||[])].forEach(r=>(r.tg||[]).forEach(([c,x])=>{if(c==="buy")fromPlan.push([d,r,x])})));
 $("p-gift").innerHTML=`
  <div class="ph"><h2>伴手禮推薦</h2><p>共 ${GIFTS.length} 項・價格多為舊資料，以店頭為準</p></div>
  <div class="chips gfil" role="group" aria-label="篩選地區">
   <button type="button" data-greg="all" aria-pressed="${giftReg==="all"}">全部</button>
   ${regs.map(r=>`<button type="button" data-greg="${r.k}" aria-pressed="${giftReg===r.k}">${esc(r.nm)}</button>`).join("")}
  </div>
  ${regs.filter(r=>giftReg==="all"||giftReg===r.k).map(r=>`
   <section class="greg"><div class="sec-t" style="margin-top:6px"><h3>${esc(r.nm)}</h3><span>${esc(r.sub)}</span></div>
   <div class="ggrid">${GIFTS.filter(g=>g.r===r.k).map(giftCard).join("")}</div></section>`).join("")}
  <div class="box"><h3>帶回台灣要注意</h3><ul class="nt">${CUSTOMS.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></div>
  ${fromPlan.length?`<div class="box"><h3>行程中會經過的地方</h3><div class="glist">${fromPlan.map(([d,r,x])=>`<div class="gi"><span class="tg buy"><b>DAY ${d.n}</b>${esc(x)}</span><span>${esc(r.ti)}</span></div>`).join("")}</div></div>`:""}`;
}
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-greg]");if(!b)return;
 giftReg=b.dataset.greg;store.set("ky-greg",giftReg);renderGift();
});

const CATS=["餐飲","交通","門票","購物","住宿","其他"];
const PAYS=["現金","信用卡","IC 卡"];
let L=store.get("ky-ledger",{items:[],rate:0.21,budget:0});
if(!Array.isArray(L.items))L.items=[];
let pickCat="餐飲",pickPay="現金",pendingDel=null;
const save=()=>store.set("ky-ledger",L);
function ledgerText(){
 const by={};L.items.forEach(i=>(by[i.d]=by[i.d]||[]).push(i));
 const tot=L.items.reduce((a,i)=>a+i.amt,0);
 let t=`【九州家族行 記帳】共 ${yen(tot)}（約 NT$${Math.round(tot*L.rate).toLocaleString("en-US")}）\n`;
 DAYS.forEach(d=>{const k=d.d;if(by[k]){t+=`\n${k}（${d.w}）\n`;by[k].forEach(i=>t+=`・${i.name||i.cat} ${yen(i.amt)}（${i.cat}・${i.pay}）\n`)}});
 if(by["其他"]){t+="\n其他日期\n";by["其他"].forEach(i=>t+=`・${i.name||i.cat} ${yen(i.amt)}（${i.cat}・${i.pay}）\n`)}
 return t;
}
function renderMoney(){

document.addEventListener("submit",e=>{
 if(e.target.id!=="addf")return;e.preventDefault();
 const amt=parseInt(String($("f-amt").value).replace(/[^\d]/g,""),10);
 if(!(amt>0)){$("f-msg").textContent="請輸入金額（日圓，只要數字）";$("f-amt").focus();return}
 L.items.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),d:$("f-day").value,cat:pickCat,pay:pickPay,name:$("f-name").value.trim(),amt});

 $("f-msg").textContent=ok?`已記下 ${yen(amt)}`:"已記下，但這個瀏覽器無法保存，關掉頁面就會不見";

});
document.addEventListener("change",e=>{

const FX={rate:(()=>{const r=parseFloat(store.get("ky-rate","0.21"));return r>0&&r<5?r:0.21})(),src:"上次使用的匯率"};
fetch("https://open.er-api.com/v6/latest/JPY").then(r=>r.json()).then(j=>{
 const r=j&&j.rates&&j.rates.TWD;if(!(r>0&&r<5))return;
 FX.rate=+r.toFixed(4);store.set("ky-rate",String(FX.rate));
 const t=new Date(j.time_last_update_unix*1000).toLocaleString("zh-TW",{timeZone:"Asia/Taipei",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
 FX.src=`即時匯率・${t} 更新`;
 const ri=document.getElementById("fx-rate"),sn=document.getElementById("fx-src");
 if(ri)ri.value=FX.rate;if(sn)sn.textContent=FX.src+"（市場中間價，換現金約貴 2–3%）";
 const ji=document.getElementById("fx-jpy");if(ji&&ji.value)ji.dispatchEvent(new Event("input",{bubbles:true}));
}).catch(()=>{});
function fxFmt(n){return n?Math.round(n).toLocaleString():""}
document.addEventListener("input",e=>{
 const t=e.target;if(!t.id||!t.id.startsWith("fx-"))return;
 const v=k=>parseFloat(String($(k).value).replace(/[^\d.]/g,""))||0;
 if(t.id==="fx-rate"){const r=parseFloat(t.value);if(r>0&&r<5){FX.rate=r;store.set("ky-rate",String(r))}$("fx-twd").value=fxFmt(v("fx-jpy")*FX.rate)}
 else if(t.id==="fx-jpy")$("fx-twd").value=fxFmt(v("fx-jpy")*FX.rate);
 else if(t.id==="fx-twd")$("fx-jpy").value=fxFmt(v("fx-twd")/FX.rate);
});

let ON=(()=>{const n=+store.get("ky-ppl",4);return n>=1&&n<=20?n:4})();
function oj(t){return t.replace(/\{n\}/g,ON)}
function renderOrder(){
 $("p-order").innerHTML=`
  <div class="ph"><h2>點餐卡</h2><p>點一下卡片就會放大，直接拿給店員看。菜名以現場菜單為準。</p></div>
  <div class="ppl"><span>幾個人用餐</span><button type="button" data-ppl="-1" aria-label="減少">−</button><b class="num" id="pplv">${ON}</b><button type="button" data-ppl="1" aria-label="增加">＋</button></div>
  <div class="chips">${ORDERS.map(g=>`<a href="#o-${g.k}">${esc(g.nm)}</a>`).join("")}</div>
  ${ORDERS.map(g=>`<section class="ogrp" id="o-${g.k}"><div class="sec-t"><h3>${esc(g.nm)}</h3></div>
   ${g.list.map(r=>`<div class="box ores"><div class="oh"><b>${esc(r.nm)}</b>${r.day?`<span>${esc(r.day)}</span>`:""}</div>
    ${r.img?`<button type="button" class="oimg" data-img="${r.img}" data-cap="${esc(r.nm)}"><img src="${r.img}" alt="${esc(r.nm)} 點餐圖" loading="lazy"></button>`:""}
    ${r.items.map((it,i)=>`<button type="button" class="ocard" data-show="${esc(g.k)}|${esc(r.nm)}|${i}"><span class="jp">${oj(it.jp)}</span><span class="zh">${esc(oj(it.zh))}</span></button>`).join("")}
   </div>`).join("")}</section>`).join("")}`;
}
document.addEventListener("click",e=>{
 const pb=e.target.closest("[data-ppl]");if(pb){ON=Math.max(1,Math.min(20,ON+ +pb.dataset.ppl));store.set("ky-ppl",ON);renderOrder();return}
 const c=e.target.closest("[data-show]");if(!c)return;
 const [gk,rn,i]=c.dataset.show.split("|");const g=ORDERS.find(x=>x.k===gk);const r=g.list.find(x=>x.nm===rn);const it=r.items[+i];
 $("osjp").innerHTML=oj(it.jp);$("oszh").textContent=oj(it.zh);$("os").hidden=false;
});
$("os").addEventListener("click",()=>{$("os").hidden=true});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("os").hidden=true});

/* ---------- 底部分頁 ---------- */
const TABS=[["plan","行程"],["gift","伴手禮"],["order","點餐"],["info","旅行資訊"]];
$("tabbar").innerHTML=TABS.map(([k,n])=>`<button type="button" role="tab" id="tb-${k}" aria-controls="p-${k}" aria-selected="false" data-tab="${k}">${IC[k]}${n}</button>`).join("");
function showTab(k){
 TABS.forEach(([t])=>{$("p-"+t).hidden=t!==k;$("tb-"+t).setAttribute("aria-selected",t===k)});
 store.set("ky-tab",k);window.scrollTo(0,0);
 if(k==="plan"){const c=document.querySelector('.dchip[aria-current="true"]');if(c)c.scrollIntoView({inline:"center",block:"nearest"})}
}
$("tabbar").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b)showTab(b.dataset.tab)});

renderStrip();renderDay();renderGift();renderOrder();renderInfo();
const hash=location.hash.slice(1);
if(/^d\d{1,2}$/.test(hash)){goDay(+hash.slice(1));showTab("plan")}
else if(["plan","gift","order","info"].includes(hash))showTab(hash);
else{const t=store.get("ky-tab","plan");showTab(["plan","gift","order","info"].includes(t)?t:"plan")}
</script>
