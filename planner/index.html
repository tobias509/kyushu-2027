<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2027 九州家族行｜行程規劃</title>
<meta name="theme-color" content="#15181D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand" id="brand" aria-hidden="true"></div>
  <div class="trip-summary">
    <h1 id="tripTitle">行程</h1>
    <p id="tripMeta"></p>
  </div>
  <div class="trip-total">
    <span class="label">總花費</span>
    <span id="totalVal" class="mono">••••••</span>
    <button id="eyeBtn" class="eye" aria-label="顯示總花費" aria-pressed="false"><i class="fa-solid fa-eye"></i></button>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button role="tab" class="tab active" data-page="planpage" aria-selected="true"><i class="fa-solid fa-route"></i> 行程規劃</button>
  <button role="tab" class="tab" data-page="expensespage" aria-selected="false"><i class="fa-solid fa-yen-sign"></i> 費用總覽</button>
  <button role="tab" class="tab" data-page="packingpage" aria-selected="false"><i class="fa-solid fa-suitcase"></i> 攜帶用品</button>
</nav>

<main>
  <section id="planpage" class="page active">
    <div id="workspace">
      <div class="leftcol">
        <section id="mappanel" class="panel">
          <div id="mapheading" class="panel-head">
            <h2><i class="fa-solid fa-map-location-dot"></i> 地圖</h2>
            <div class="map-btns">
              <button id="previewroute" class="hbtn">路徑預覽</button>
              <button id="fit" class="hbtn">整天概覽</button>
            </div>
          </div>
          <div id="map"></div>
          <p class="map-note">座標與路線為示意（直線），點兩下地點開 Google Maps 導航。</p>
        </section>
        <section id="routepanel" class="panel">
          <button class="summary panel-head" id="routeToggle" aria-expanded="true">
            <h2><i class="fa-solid fa-train-subway"></i> 交通明細</h2>
            <i class="fa-solid fa-chevron-up chev"></i>
          </button>
          <div id="routelist"></div>
        </section>
      </div>

      <section id="calendarpanel" class="panel">
        <div id="paneltoolbar" class="panel-head">
          <div class="cal-title">
            <h2><i class="fa-regular fa-calendar"></i> 行事曆</h2>
            <span id="ym" class="mono"></span>
          </div>
          <div id="calendar-viewtoggle" role="group" aria-label="檢視">
            <button data-view="week" class="vbtn">週</button>
            <button data-view="day" class="vbtn">單日</button>
          </div>
          <div id="toolbarbuttons">
            <button id="weekPrev" class="ibtn" aria-label="上一週"><i class="fa-solid fa-chevron-left"></i></button>
            <button id="weekNext" class="ibtn" aria-label="下一週"><i class="fa-solid fa-chevron-right"></i></button>
            <button id="undoBtn" class="ibtn" aria-label="復原"><i class="fa-solid fa-rotate-left"></i></button>
            <button id="addBtn" class="ibtn add" aria-label="新增地點"><i class="fa-solid fa-plus"></i></button>
          </div>
        </div>
        <div class="timeline-dates" id="datestrip">
          <div class="date-illo" id="dateIllo" role="img"></div>
          <div class="stations" id="stations"></div>
        </div>
        <div id="calendar"></div>
      </section>
    </div>
  </section>

  <section id="expensespage" class="page">
    <div class="exp-grid">
      <div class="exp-left">
        <div class="sum-card">
          <div class="sum-row"><span>外幣合計（JPY）</span><b id="sumJPY" class="mono"></b></div>
          <div class="sum-row"><span>結算幣別合計（TWD）</span><b id="sumTWD" class="mono"></b></div>
          <div class="sum-row rate"><label for="rateInput">匯率 1 JPY ＝</label><input id="rateInput" type="number" step="0.0001" min="0" placeholder="待填" inputmode="decimal"><span>TWD</span></div>
          <div class="sum-row big"><span>換算總額（TWD）</span><b id="sumAll" class="mono"></b></div>
          <p class="hint" id="pendingHint"></p>
        </div>
        <div class="exp-table-wrap">
          <table class="exp-table">
            <thead><tr><th>日期</th><th>項目</th><th>單價</th><th>計價</th><th>小計</th><th>狀態</th></tr></thead>
            <tbody id="expBody"></tbody>
          </table>
        </div>
      </div>
      <div class="exp-right">
        <div class="pie-card">
          <h3>支出組成</h3>
          <svg id="pie" viewBox="0 0 200 200" role="img" aria-label="支出組成圓餅圖"></svg>
          <ul id="legend" class="legend"></ul>
        </div>
        <div class="pending-card">
          <h3>待填金額</h3>
          <ul id="pendingList"></ul>
        </div>
      </div>
    </div>
  </section>

  <section id="packingpage" class="page">
    <div class="pack-top">
      <div class="progress"><div class="bar"><i id="packBar"></i></div><span id="packPct" class="mono"></span></div>
      <input id="packSearch" type="search" placeholder="搜尋用品" aria-label="搜尋用品">
      <div class="pack-filter" role="group" aria-label="篩選">
        <button data-f="all" class="vbtn on">全部</button>
        <button data-f="todo" class="vbtn">未完成</button>
        <button data-f="done" class="vbtn">已完成</button>
      </div>
    </div>
    <div id="packGrid" class="pack-grid"></div>
  </section>
</main>

<div class="fab" id="fab">
  <div class="fab-menu" id="fabMenu" role="menu" hidden>
    <button role="menuitem" data-act="exportJSON"><i class="fa-solid fa-file-export"></i> 匯出 JSON</button>
    <button role="menuitem" data-act="importJSON"><i class="fa-solid fa-file-import"></i> 匯入 JSON</button>
    <button role="menuitem" data-act="exportICS"><i class="fa-regular fa-calendar-plus"></i> 匯出行事曆 ICS</button>
    <button role="menuitem" data-act="backup"><i class="fa-solid fa-snowflake"></i> 極端天氣備案</button>
    <button role="menuitem" data-act="notes"><i class="fa-solid fa-circle-info"></i> 注意事項</button>
    <button role="menuitem" data-act="reset" class="danger"><i class="fa-solid fa-arrow-rotate-left"></i> 還原預設資料</button>
  </div>
  <button class="fab-btn" id="fabBtn" aria-label="工具" aria-expanded="false" aria-controls="fabMenu"><i class="fa-solid fa-bars"></i></button>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
</div>

<div id="popover" class="popover" role="dialog" hidden></div>

<dialog id="editor">
  <form id="editForm" method="dialog">
    <h3 id="editTitle">編輯行程</h3>
    <div class="fgrid">
      <label class="full">名稱<input name="name" required></label>
      <label>類別<select name="cat">
        <option value="spot">景點</option><option value="food">餐飲</option><option value="stay">住宿</option><option value="move">交通與航班</option>
      </select></label>
      <label>日期<select name="date" id="dateSelect"></select></label>
      <label>開始時間<input name="start" type="time" required></label>
      <label>時長（分鐘）<input name="dur" type="number" min="5" step="5" required></label>
      <label class="full">地址<input name="addr"></label>
      <label>緯度<input name="lat" type="number" step="0.0001"></label>
      <label>經度<input name="lng" type="number" step="0.0001"></label>
      <label>金額<input name="amt" type="number" min="0" step="1" placeholder="待填"></label>
      <label>幣別<select name="cur"><option>JPY</option><option>TWD</option></select></label>
      <label>計價<select name="unit"><option value="person">每人</option><option value="car">每車</option><option value="group">全團</option></select></label>
      <label>狀態<select name="status"><option value="">一般</option><option value="confirm">待確認</option><option value="optional">可取消</option></select></label>
      <label class="chk"><input type="checkbox" name="est"> 估算金額</label>
      <label class="chk"><input type="checkbox" name="paid"> 已付款</label>
      <label class="chk"><input type="checkbox" name="locked"> 鎖定（已預約）</label>
    </div>
    <fieldset id="moveFields">
      <legend>交通分段</legend>
      <div class="fgrid">
        <label>主要方式<select name="mode" class="modeSel"></select></label>
        <label>起點<input name="from"></label>
        <label>終點<input name="to"></label>
      </div>
      <div id="segList"></div>
      <button type="button" id="addSeg" class="sbtn"><i class="fa-solid fa-plus"></i> 新增分段</button>
    </fieldset>
    <label class="full">備註<textarea name="note" rows="2"></textarea></label>
    <div class="form-actions">
      <button type="button" id="delBtn" class="sbtn danger"><i class="fa-solid fa-trash"></i> 刪除</button>
      <span class="sp"></span>
      <button type="button" id="cancelBtn" class="sbtn">取消</button>
      <button type="submit" class="sbtn primary">儲存</button>
    </div>
  </form>
</dialog>

<dialog id="infoDlg"><div id="infoBody"></div><form method="dialog" class="form-actions"><span class="sp"></span><button class="sbtn primary">關閉</button></form></dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js"></script>
<script src="illustrations.js"></script>
<script src="app.js"></script>
</body>
</html>
